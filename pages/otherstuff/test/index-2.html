<script>
   // Get the elements
   var hoverElement = document.getElementById("hover-element");
   var hoverSound = document.getElementById("hover-sound");

   // Add an event listener for mouseover (hover)
   hoverElement.addEventListener("mouseover", function() {
       hoverSound.play();
   });

   // Optional: Add event listener for mouseleave to stop and reset the sound
   hoverElement.addEventListener("mouseleave", function() {
       hoverSound.pause();
       hoverSound.currentTime = 0; // Reset sound to the beginning
   });
</script>
